name: Net Profit tests
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 love xvfb zip
      - run: make test
      - run: make bench
      - run: xvfb-run -a make smoke soak
        env:
          ALSOFT_DRIVERS: "null"
      # A measurement rather than a test, like `bench`: it prints what the
      # interface draws on top of itself and does not fail the build for it.
      - run: xvfb-run -a make layout
        env:
          ALSOFT_DRIVERS: "null"
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: net-profit
          path: dist/net-profit.love
